<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g fill="#E8112D">
    <!-- concentric rings -->
    <circle cx="50" cy="50" r="35" fill="none" stroke="#E8112D" stroke-width="5"/>
    <circle cx="50" cy="50" r="23" fill="none" stroke="#E8112D" stroke-width="5"/>
    <!-- N/S/E/W crosshair ticks -->
    <rect x="47.5" y="3"    width="5"  height="27" rx="1"/>
    <rect x="47.5" y="70"   width="5"  height="27" rx="1"/>
    <rect x="3"    y="47.5" width="27" height="5"  rx="1"/>
    <rect x="70"   y="47.5" width="27" height="5"  rx="1"/>
    <!-- centre dot (the exact target point) -->
    <circle cx="50" cy="50" r="12"/>
  </g>
</svg>
